name: QA Gate

on:
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install ruff mypy bandit vulture pytest pytest-cov pip-audit

      - name: Static Analysis
        run: |
          ruff check --select=ALL .
          mypy --strict --ignore-missing-imports .
          bandit -r . -ll
          vulture --min-confidence 80 .

      - name: Tests with Coverage
        run: pytest -xvs --cov=downloader --cov=platforms --cov=deps --cov=config --cov=cli --cov-fail-under=80

      - name: Dependency Audit
        run: pip-audit

      - name: Smoke Tests (mocked)
        run: python scripts/qa_gate.py --smoke-only

      - name: Chaos Tests
        run: python scripts/qa_gate.py --chaos-only