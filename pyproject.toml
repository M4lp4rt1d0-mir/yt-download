[tool.ruff]
select = ["ALL"]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D107",
    "ANN201", "ANN202",
    "ARG001", "ARG002",
    "S101",  # assert in tests is expected
    "S108",  # /tmp in tests is OK
    "PLR2004",  # magic values in tests
    "PT006",  # pytest parametrize format
    "ANN401",  # Any in test fixtures
    "CPY001",  # copyright notice
]
line-length = 100
target-version = "py311"
exclude = ["criacoes_testes-vercoes_anteriores/**"]

[tool.ruff.lint]
per-file-ignores = [
    "tests/**", ["S101", "S108", "PLR2004", "PT006", "ANN401", "ARG002", "ANN201", "PLC0415", "SIM117", "D103", "D205", "D212", "E402", "I001", "F401", "W292"],
    "scripts/**", ["S101", "S108", "PLR2004", "PT006", "ANN401", "ARG002", "ANN201"],
]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
exclude = [
    "criacoes_testes-vercoes_anteriores/**",
    "tests/**",
    "scripts/**",
]

[tool.bandit]
exclude_dirs = ["tests", "qa", "scripts", "criacoes_testes-vercoes_anteriores"]
severity_level = "low"
confidence_level = "high"

[tool.vulture]
min_confidence = 80
exclude = ["tests/*", "qa/*", "scripts/*", "criacoes_testes-vercoes_anteriores/*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]